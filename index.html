<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="my little APPS">
  <title>my little APPS</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --card: #ffffff;
      --ink: #152238;
      --muted: #64748b;
      --line: #e2e8f0;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(36px, env(safe-area-inset-top)) 20px max(30px, env(safe-area-inset-bottom));
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: grid;
      place-items: center;
    }
    main { width: 100%; max-width: 440px; }
    header { text-align: center; margin-bottom: 30px; }
    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 6vw, 2.15rem);
      font-weight: 800;
      letter-spacing: -0.045em;
      background: linear-gradient(110deg, #059669, #2563eb);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle { margin: 9px 0 0; font-size: .91rem; color: var(--muted); }
    .apps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .app {
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      min-height: 166px;
      padding: 22px 12px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(15,23,42,.035);
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .app:active { transform: scale(.97); }
    .app:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
    @media (hover: hover) {
      .app:hover { transform: translateY(-3px); border-color: #b5c8db; box-shadow: 0 12px 24px rgba(15,23,42,.075); }
    }
    .symbol {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border-radius: 18px;
      font-size: 1.8rem;
      background: var(--tint);
    }
    .app-name { font-size: 1rem; font-weight: 800; letter-spacing: -.015em; }
    .app-detail { font-size: .76rem; line-height: 1.35; color: var(--muted); }
    footer { margin-top: 30px; text-align: center; font-size: .75rem; color: #94a3b8; }
    @media (max-width: 320px) { .apps { gap: 10px; } .app { padding-inline: 8px; } }
    @media (prefers-reduced-motion: reduce) { .app { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>my little APPS</h1>
      <p class="subtitle">A little home for the things I track and explore.</p>
    </header>
    <nav class="apps" aria-label="My applications">
      <a class="app" href="./DailyTracker/" style="--tint:#e7f7ef">
        <span class="symbol" aria-hidden="true">✓</span>
        <span class="app-name">HABITS</span>
        <span class="app-detail">Daily routines</span>
      </a>
      <a class="app" href="./RetaTracker/" style="--tint:#e8f0ff">
        <span class="symbol" aria-hidden="true">💉</span>
        <span class="app-name">RETA</span>
        <span class="app-detail">Dose tracker</span>
      </a>
      <a class="app" href="./MedsTracker/" style="--tint:#f1eafe">
        <span class="symbol" aria-hidden="true">💊</span>
        <span class="app-name">MEDS</span>
        <span class="app-detail">Medications</span>
      </a>
      <a class="app" href="./UNESCO/" style="--tint:#fff2dd">
        <span class="symbol" aria-hidden="true">🌍</span>
        <span class="app-name">UNESCO</span>
        <span class="app-detail">World heritage</span>
      </a>
    </nav>
    <footer>Made for the little things that matter.</footer>
  </main>
</body>
</html>
