<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Habit Track">
  <meta name="theme-color" content="#0b132b">
  <title>Daily Habit Tracker</title>
  <style>
    :root {
      --bg-main: #0b132b;
      --bg-card: #1c2541;
      --bg-input: #2a385b;
      --accent-green: #06d6a0;
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 16px 16px 32px 16px;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 20px 0;
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #06d6a0, #3a86ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .progress-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--accent-green);
    }

    /* Card Styling */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 12px 28px -6px rgba(0,0,0,0.35);
    }

    .card-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-secondary);
      font-weight: 700;
      margin-bottom: 10px;
    }

    /* Date Bar */
    .date-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .date-display {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
    }

    .date-sub {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .date-nav-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      width: 40px;
      height: 40px;
      border-radius: 14px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
    }

    .date-nav-btn:active {
      transform: scale(0.92);
      background: rgba(255,255,255,0.15);
    }

    /* Habit Items Checklist */
    .habit-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .habit-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .habit-card:active {
      transform: scale(0.98);
    }

    .habit-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .habit-icon-bg {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--bg-input);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      transition: all 0.2s ease;
    }

    .habit-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
    }

    .habit-sub {
      font-size: 0.72rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Circular Check Switch */
    .check-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 800;
      color: transparent;
      transition: all 0.25s ease;
    }

    .habit-card.completed .check-circle {
      border-color: transparent;
      color: #0d1b2a;
    }

    /* 1-5 Scale Selector (Mood & Energy) */
    .scale-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .scale-btn {
      flex: 1;
      aspect-ratio: 1;
      border-radius: 12px;
      background: var(--bg-input);
      border: 2px solid var(--border-color);
      color: var(--text-secondary);
      font-weight: 800;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .scale-btn:active {
      transform: scale(0.9);
    }

    .scale-btn.active {
      color: #0d1b2a;
    }

    /* Trends / Streak Card */
    .trends-card {
      background: linear-gradient(135deg, rgba(6, 214, 160, 0.14), rgba(58, 134, 255, 0.14));
      border: 1px solid rgba(6, 214, 160, 0.35);
      border-radius: 24px;
      padding: 18px 16px;
      margin-bottom: 16px;
      display: none;
      animation: trendsIn 0.35s ease;
    }

    .trends-card.visible {
      display: block;
    }

    @keyframes trendsIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .trends-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--accent-green);
      font-weight: 800;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .trends-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .trend-stat {
      flex: 1;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 10px 6px;
    }

    .trend-value {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
    }

    .trend-label {
      font-size: 0.66rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-top: 4px;
      font-weight: 700;
    }

    /* History Feed */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-date {
      font-weight: 700;
      font-size: 0.9rem;
    }

    .history-count {
      font-size: 0.72rem;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .history-dots-row {
      display: flex;
      gap: 6px;
      align-items: flex-start;
    }

    .dot-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .dot-symbol {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      font-weight: 800;
      transition: all 0.2s ease;
    }

    .dot-symbol.active {
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      color: #032b20;
    }

    .dot-letter {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .load-more-btn {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--accent-green);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .load-more-btn:active {
      transform: scale(0.98);
      background: var(--bg-input);
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-secondary);
      font-size: 0.88rem;
      background: var(--bg-card);
      border-radius: 18px;
      border: 1px dashed var(--border-color);
    }

    /* Daily Quote Card */
    .quote-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 16px 18px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }

    .quote-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, #06d6a0, #3a86ff);
    }

    .quote-text {
      font-size: 0.9rem;
      font-style: italic;
      line-height: 1.45;
      color: #fff;
      padding-left: 6px;
    }

    .quote-author {
      font-size: 0.74rem;
      color: var(--text-secondary);
      margin-top: 8px;
      padding-left: 6px;
      font-weight: 700;
    }
  </style>
</head>

    function dayOfYear(dateObj) {
      const start = new Date(dateObj.getFullYear(), 0, 0);
      const diff = dateObj - start;
      return Math.floor(diff / 86400000);
    }

    function renderQuote(dateObj) {
      const idx = dayOfYear(dateObj) % QUOTES.length;
      const q = QUOTES[idx];
      document.getElementById('quoteText').innerText = `"${q.text}"`;
      document.getElementById('quoteAuthor').innerText = `— ${q.author}`;
    }

    let selectedDate = new Date();
    let trackerData = {};
    let historyLimit = 14;

    function getHabitsForDate(dateObj) {
      const dayOfWeek = dateObj.getDay();
      return ALL_HABITS.filter(h => h.days.includes(dayOfWeek));
    }

    function formatDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDateDisplay(dateObj) {
      const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
      return dateObj.toLocaleDateString('en-US', options);
    }

    function init() {
      loadStorage();
      updateUI();
    }

    function loadStorage() {
      const stored = localStorage.getItem('daily_habits_data_v2');
      if (stored) {
        try {
          trackerData = JSON.parse(stored);
        } catch (e) {
          trackerData = {};
        }
      }
      pruneOldData();
    }

    function pruneOldData() {
      const cutoffDate = new Date();
      cutoffDate.setDate(cutoffDate.getDate() - 35);
      const cutoffKey = formatDateKey(cutoffDate);

      Object.keys(trackerData).forEach(key => {
        if (key < cutoffKey) {
          delete trackerData[key];
        }
      });
      saveStorage();
    }

    function saveStorage() {
      localStorage.setItem('daily_habits_data_v2', JSON.stringify(trackerData));
    }

    function shiftDay(days) {
      selectedDate.setDate(selectedDate.getDate() + days);
      updateUI();
    }

    // --- Trends / Streak helpers ---
    function isDayComplete(dateObj) {
      const dayHabits = getHabitsForDate(dateObj);
      if (dayHabits.length === 0) return false;
      const rec = trackerData[formatDateKey(dateObj)] || {};
      const doneCount = dayHabits.filter(h => !!rec[h.id]).length;
      return doneCount > 4;
    }

    function calcCurrentStreak() {
      let cursor = new Date();
      if (!isDayComplete(cursor)) {
        cursor.setDate(cursor.getDate() - 1);
      }
      let streak = 0;
      while (isDayComplete(cursor)) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      }
      return streak;
    }

    function calcBestStreak() {
      let best = 0, run = 0;
      let d = new Date();
      d.setDate(d.getDate() - 34);
      for (let i = 0; i < 35; i++) {
        if (isDayComplete(d)) {
          run++;
          best = Math.max(best, run);
        } else {
          run = 0;
        }
        d.setDate(d.getDate() + 1);
      }
      return best;
    }

    function calcWeekRate() {
      let done = 0, possible = 0;
      let d = new Date();
      for (let i = 0; i < 7; i++) {
        const dayHabits = getHabitsForDate(d);
        const rec = trackerData[formatDateKey(d)] || {};
        possible += dayHabits.length;
        done += dayHabits.filter(h => !!rec[h.id]).length;
        d.setDate(d.getDate() - 1);
      }
      return possible ? Math.round((done / possible) * 100) : 0;
    }

    function renderTrends(show) {
      const card = document.getElementById('trendsCard');
      if (!show) {
        card.classList.remove('visible');
        return;
      }
      document.getElementById('statCurrentStreak').innerText = calcCurrentStreak();
      document.getElementById('statBestStreak').innerText = calcBestStreak();
      document.getElementById('statWeekRate').innerText = calcWeekRate() + '%';
      card.classList.add('visible');
    }

    function updateUI() {
      const dateKey = formatDateKey(selectedDate);
      const todayKey = formatDateKey(new Date());

      renderQuote(selectedDate);

      document.getElementById('dateDisplay').innerText = formatDateDisplay(selectedDate);
      const subEl = document.getElementById('dateSub');
      if (dateKey === todayKey) {
        subEl.innerText = 'Today';
        subEl.style.color = 'var(--accent-green)';
      } else {
        subEl.innerText = dateKey;
        subEl.style.color = 'var(--text-secondary)';
      }

      if (!trackerData[dateKey]) {
        trackerData[dateKey] = {};
      }
      const currentDayData = trackerData[dateKey];
      const activeHabits = getHabitsForDate(selectedDate);

      const listEl = document.getElementById('habitList');
      listEl.innerHTML = '';

      let completedCount = 0;

      activeHabits.forEach(habit => {
        const isScale = habit.type === 'scale';
        const rawValue = currentDayData[habit.id];
        const isDone = !!rawValue;
        if (isDone) completedCount++;

        const card = document.createElement('div');
        card.className = `habit-card ${isDone ? 'completed' : ''}`;

        if (isDone) {
          card.style.borderColor = habit.color;
          card.style.boxShadow = `0 0 16px ${habit.color}60, inset 0 0 10px ${habit.color}20`;
          card.style.background = '#1a2747';
        } else {
          card.style.borderColor = 'var(--border-color)';
          card.style.boxShadow = 'none';
          card.style.background = 'var(--bg-card)';
        }

        if (isScale) {
          const max = habit.scaleMax || 5;
          let btnsHtml = '';
          for (let v = 1; v <= max; v++) {
            const active = rawValue === v;
            btnsHtml += `
              <div class="scale-btn ${active ? 'active' : ''}" style="${active ? `background: ${habit.color}; border-color: ${habit.color};` : ''}" data-value="${v}">
                ${v}
              </div>
            `;
          }
          card.innerHTML = `
            <div class="habit-info">
              <div class="habit-icon-bg" style="${isDone ? `background: ${habit.color}30; color: ${habit.color}` : ''}">
                ${habit.icon}
              </div>
              <div>
                <div class="habit-name">${habit.name}</div>
                <div class="habit-sub">${isDone ? `Rated ${rawValue}/${max}` : 'Tap a number to rate'}</div>
              </div>
            </div>
            <div class="scale-row">${btnsHtml}</div>
          `;
          card.querySelectorAll('.scale-btn').forEach(btn => {
            btn.onclick = (e) => {
              e.stopPropagation();
              setScaleValue(habit.id, parseInt(btn.dataset.value, 10));
            };
          });
        } else {
          card.onclick = () => toggleHabit(habit.id);
          card.innerHTML = `
            <div class="habit-info">
              <div class="habit-icon-bg" style="${isDone ? `background: ${habit.color}30; color: ${habit.color}` : ''}">
                ${habit.icon}
              </div>
              <div>
                <div class="habit-name">${habit.name}</div>
                <div class="habit-sub">${isDone ? 'Completed' : 'Tap to mark done'}</div>
              </div>
            </div>
            <div class="check-circle" style="${isDone ? `background: ${habit.color};` : ''}">
              ${isDone ? '✓' : ''}
            </div>
          `;
        }

        listEl.appendChild(card);
      });

      document.getElementById('progressBadge').innerText = `${completedCount} / ${activeHabits.length} Done`;

      renderTrends(completedCount > 4);
      renderHistory();
    }

    function toggleHabit(habitId) {
      const dateKey = formatDateKey(selectedDate);
      if (!trackerData[dateKey]) {
        trackerData[dateKey] = {};
      }
      trackerData[dateKey][habitId] = !trackerData[dateKey][habitId];
      saveStorage();
      updateUI();
    }

    function setScaleValue(habitId, value) {
      const dateKey = formatDateKey(selectedDate);
      if (!trackerData[dateKey]) {
        trackerData[dateKey] = {};
      }
      // tapping the already-selected value clears the rating
      trackerData[dateKey][habitId] = trackerData[dateKey][habitId] === value ? 0 : value;
      saveStorage();
      updateUI();
    }

    function renderHistory() {
      const historyEl = document.getElementById('historyList');
      historyEl.innerHTML = '';

      const sortedKeys = Object.keys(trackerData).sort().reverse();

      if (sortedKeys.length === 0) {
        historyEl.innerHTML = '<div class="empty-state">No recorded habits yet. Tap a task above to log your first day!</div>';
        return;
      }

      const visibleKeys = sortedKeys.slice(0, historyLimit);

      visibleKeys.forEach(key => {
        const dayRecord = trackerData[key] || {};
        const [y, m, d] = key.split('-');
        const dateObj = new Date(y, m - 1, d);
        const displayDate = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        
        const dayHabits = getHabitsForDate(dateObj);

        let doneNum = 0;
        let columnsHtml = '';

        dayHabits.forEach(h => {
          const rawValue = dayRecord[h.id];
          const isDone = !!rawValue;
          if (isDone) doneNum++;

          const isScale = h.type === 'scale';
          const symbolContent = isDone ? (isScale ? rawValue : '✓') : '';
          const titleText = isDone
            ? (isScale ? `${h.name}: ${rawValue}/${h.scaleMax || 5}` : `${h.name}: Done`)
            : `${h.name}: Incomplete`;

          columnsHtml += `
            <div class="dot-column">
              <div class="dot-symbol ${isDone ? 'active' : ''}" 
                   style="${isDone ? `background: ${h.color}; box-shadow: 0 0 8px ${h.color}80;` : 'background: rgba(255,255,255,0.08);'}"
                   title="${titleText}">
                ${symbolContent}
              </div>
              <span class="dot-letter">${h.letter}</span>
            </div>
          `;
        });

        const row = document.createElement('div');
        row.className = 'history-item';
        row.innerHTML = `
          <div>
            <div class="history-date">${displayDate}</div>
            <div class="history-count">${doneNum}/${dayHabits.length} Completed</div>
          </div>
          <div class="history-dots-row">
            ${columnsHtml}
          </div>
        `;
        historyEl.appendChild(row);
      });

      if (sortedKeys.length > historyLimit) {
        const loadMoreBtn = document.createElement('button');
        loadMoreBtn.className = 'load-more-btn';
        loadMoreBtn.innerText = 'Show 21 More Days';
        loadMoreBtn.onclick = () => {
          historyLimit += 21;
          renderHistory();
        };
        historyEl.appendChild(loadMoreBtn);
      }
    }

    window.onload = init;
  </script>
</body>
</html>
