<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MedTracker">
  <meta name="theme-color" content="#fcf8f7">
  <title>MedTracker • For Marc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #faf5f3;
      --card-white: #ffffff;
      --text-dark: #2d2627;
      --text-muted: #8b7e80;
      
      /* Advil / Ibuprofen Theme (Warm Terracotta / Peach) */
      --advil-primary: #e76f51;
      --advil-light: #fef0eb;
      --advil-border: #fcd5c9;
      --advil-pill: #d65a3b;
      
      /* Tylenol / Acetaminophen Theme (Ocean Aqua / Mint) */
      --tylenol-primary: #2a9d8f;
      --tylenol-light: #e8f7f5;
      --tylenol-border: #c2ece6;
      --tylenol-pill: #1f7d72;

      --danger-red: #e63946;
      --danger-bg: #ffebee;
      --border-subtle: rgba(45, 38, 39, 0.08);
      --shadow-soft: 0 10px 24px -6px rgba(180, 140, 140, 0.12), 0 4px 8px -2px rgba(180, 140, 140, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-dark);
      min-height: 100vh;
      padding: 18px 16px 44px 16px;
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      text-align: center;
      padding: 10px 0 16px 0;
    }

    .bear-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: #ffffff;
      border-radius: 50%;
      font-size: 26px;
      box-shadow: 0 4px 14px rgba(220, 180, 170, 0.25);
      border: 2px solid #ffede7;
      margin-bottom: 8px;
    }

    .greeting-title {
      font-family: 'Nunito', cursive, sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--text-dark);
      letter-spacing: -0.3px;
    }

    .greeting-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 2px;
    }

    /* Centered Date Banner */
    .date-center-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .date-center-banner span.date-text {
      background: #ffffff;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      color: var(--text-dark);
    }

    /* Medication Cards Grid */
    .med-cards-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 18px;
    }

    .card {
      background: var(--card-white);
      border-radius: 24px;
      padding: 16px;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border-subtle);
      position: relative;
    }

    .card.advil {
      border-top: 4px solid var(--advil-primary);
    }

    .card.tylenol {
      border-top: 4px solid var(--tylenol-primary);
    }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .med-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .med-icon {
      font-size: 1.25rem;
    }

    .med-name {
      font-family: 'Nunito', cursive, sans-serif;
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--text-dark);
      line-height: 1.1;
    }

    .med-generic {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Dose Selector Pill Tabs */
    .dose-selector-tabs {
      display: flex;
      background: var(--bg-cream);
      border-radius: 12px;
      padding: 3px;
      gap: 2px;
      border: 1px solid var(--border-subtle);
    }

    .dose-tab {
      border: none;
      background: transparent;
      padding: 6px 12px;
      border-radius: 9px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .card.advil .dose-tab.active {
      background: var(--advil-primary);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(231, 111, 81, 0.3);
    }

    .card.tylenol .dose-tab.active {
      background: var(--tylenol-primary);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(42, 157, 143, 0.3);
    }

    /* Daily Limit Progress */
    .progress-section {
      margin-bottom: 10px;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.76rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .progress-used {
      color: var(--text-dark);
    }

    .progress-max {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.7rem;
    }

    .progress-bar-bg {
      height: 8px;
      background: #f1eae6;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 10px;
      transition: width 0.4s ease, background-color 0.3s;
    }

    .card.advil .progress-bar-fill {
      background: linear-gradient(90deg, #f4a261, var(--advil-primary));
    }

    .card.tylenol .progress-bar-fill {
      background: linear-gradient(90deg, #48cae4, var(--tylenol-primary));
    }

    .progress-bar-fill.warning {
      background: #f39c12 !important;
    }

    .progress-bar-fill.maxed {
      background: var(--danger-red) !important;
    }

    /* Warning Banner */
    .dose-warning-badge {
      display: none;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      margin-bottom: 10px;
      text-align: center;
    }

    .dose-warning-badge.caution {
      display: block;
      background: #fff8e1;
      color: #b78103;
      border: 1px solid #ffe082;
    }

    .dose-warning-badge.hard-limit {
      display: block;
      background: var(--danger-bg);
      color: var(--danger-red);
      border: 1px solid #ffcdd2;
    }

    /* Separate Single-Line Wait/Ready Notification */
    .wait-notification-line {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 10px;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card.advil .wait-notification-line.waiting {
      background: var(--advil-light);
      color: var(--advil-pill);
      border: 1px solid var(--advil-border);
    }

    .card.advil .wait-notification-line.ready {
      background: #e8f8f0;
      color: #1e7e48;
      border: 1px solid #c2e9d2;
    }

    .card.tylenol .wait-notification-line.waiting {
      background: var(--tylenol-light);
      color: var(--tylenol-pill);
      border: 1px solid var(--tylenol-border);
    }

    .card.tylenol .wait-notification-line.ready {
      background: #e8f8f0;
      color: #1e7e48;
      border: 1px solid #c2e9d2;
    }

    /* Action Logging Row */
    .action-row {
      display: flex;
      gap: 8px;
    }

    .btn-log-now {
      flex: 1;
      padding: 12px 14px;
      border-radius: 16px;
      border: none;
      font-family: 'Nunito', cursive, sans-serif;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #ffffff;
      transition: transform 0.1s, opacity 0.2s, background-color 0.2s;
    }

    .card.advil .btn-log-now.state-ready {
      background: var(--advil-primary);
      box-shadow: 0 4px 12px rgba(231, 111, 81, 0.35);
    }

    .card.advil .btn-log-now.state-wait {
      background: #f7a38d;
      color: #ffffff;
    }

    .card.tylenol .btn-log-now.state-ready {
      background: var(--tylenol-primary);
      box-shadow: 0 4px 12px rgba(42, 157, 143, 0.35);
    }

    .card.tylenol .btn-log-now.state-wait {
      background: #73c2b8;
      color: #ffffff;
    }

    .btn-log-now:disabled {
      background: #e0d8d6 !important;
      color: #9c9290 !important;
      box-shadow: none !important;
      cursor: not-allowed;
    }

    .btn-log-now:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn-log-past {
      background: var(--bg-cream);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      color: var(--text-dark);
      padding: 0 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-log-past:active {
      background: #f0e6e2;
    }

    /* History Timeline Card */
    .history-card {
      background: var(--card-white);
      border-radius: 24px;
      padding: 18px 16px;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border-subtle);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .history-title {
      font-family: 'Nunito', cursive, sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .btn-clear {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .btn-clear:hover {
      color: var(--danger-red);
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 14px;
      background: var(--bg-cream);
      border-left: 4px solid #ccc;
    }

    .history-item.advil {
      border-left-color: var(--advil-primary);
    }

    .history-item.tylenol {
      border-left-color: var(--tylenol-primary);
    }

    .history-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .history-med-name {
      font-weight: 800;
      font-size: 0.85rem;
    }

    .history-med-dose {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .history-time {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .history-delete-btn {
      background: transparent;
      border: none;
      color: #c2b5b4;
      font-size: 1rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .history-delete-btn:hover {
      color: var(--danger-red);
    }

    .empty-state {
      text-align: center;
      padding: 24px 0;
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    /* Modal for Past Doses */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(45, 38, 39, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 20px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .modal-title {
      font-family: 'Nunito', cursive, sans-serif;
      font-size: 1.15rem;
      font-weight: 900;
      margin-bottom: 12px;
      text-align: center;
    }

    .modal-group {
      margin-bottom: 14px;
    }

    .modal-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: block;
    }

    .modal-time-input {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      text-align: center;
      background: var(--bg-cream);
    }

    .modal-quick-chips {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .modal-chip {
      flex: 1;
      padding: 6px;
      background: var(--bg-cream);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .modal-chip:active {
      background: #e9e0de;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .btn-modal-cancel {
      flex: 1;
      padding: 10px;
      background: var(--bg-cream);
      border: none;
      border-radius: 12px;
      font-weight: 700;
      color: var(--text-dark);
      cursor: pointer;
    }

    .btn-modal-save {
      flex: 1;
      padding: 10px;
      background: var(--advil-primary);
      border: none;
      border-radius: 12px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Dynamic Header for Marc -->
  <header>
    <div class="bear-badge">🐻</div>
    <div class="greeting-title" id="greetingTitle">Good day, Marc 🌸</div>
    <div class="greeting-sub" id="greetingSub">Rest up and heal gently today.</div>
  </header>

  <!-- Centered Clean Date Header -->
  <div class="date-center-banner">
    <span>📅</span>
    <span class="date-text" id="liveDateText">Today</span>
  </div>

  <!-- Medication Tracker Cards -->
  <div class="med-cards-container">

    <!-- Advil / Ibuprofen Card -->
    <div class="card advil" id="advilCard">
      <div class="card-top-row">
        <div class="med-title-wrap">
          <span class="med-icon">🧡</span>
          <div>
            <div class="med-name">Advil</div>
            <div class="med-generic">Ibuprofen</div>
          </div>
        </div>

        <!-- Dosage Switcher -->
        <div class="dose-selector-tabs">
          <button class="dose-tab" id="advilDose200" onclick="setDoseSelection('advil', 200)">200 mg</button>
          <button class="dose-tab active" id="advilDose400" onclick="setDoseSelection('advil', 400)">400 mg</button>
        </div>
      </div>

      <!-- Daily Progress Section -->
      <div class="progress-section">
        <div class="progress-labels">
          <span class="progress-used" id="advilUsedText">0 mg taken</span>
          <span class="progress-max">Max: 1,600 mg/day</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="advilProgressFill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Hard Limit Warning Banner -->
      <div class="dose-warning-badge" id="advilWarningBadge"></div>

      <!-- Separate Single-Line Wait/Ready Notification -->
      <div class="wait-notification-line ready" id="advilWaitNotification">
        <span id="advilWaitText">Ready for next dose</span>
        <span id="advilWaitClock">Now</span>
      </div>

      <!-- Action Row -->
      <div class="action-row">
        <button class="btn-log-now state-ready" id="advilLogBtn" onclick="logDose('advil')">
          <span>+</span> <span id="advilLogBtnText">Ready</span>
        </button>
        <button class="btn-log-past" onclick="openPastModal('advil')" title="Log past dose">
          ⏱️ Past
        </button>
      </div>
    </div>

    <!-- Tylenol / Acetaminophen Card -->
    <div class="card tylenol" id="tylenolCard">
      <div class="card-top-row">
        <div class="med-title-wrap">
          <span class="med-icon">🩵</span>
          <div>
            <div class="med-name">Tylenol</div>
            <div class="med-generic">Acetaminophen</div>
          </div>
        </div>

        <!-- Dosage Switcher -->
        <div class="dose-selector-tabs">
          <button class="dose-tab" id="tylenolDose500" onclick="setDoseSelection('tylenol', 500)">500 mg</button>
          <button class="dose-tab active" id="tylenolDose1000" onclick="setDoseSelection('tylenol', 1000)">1000 mg</button>
        </div>
      </div>

      <!-- Daily Progress Section -->
      <div class="progress-section">
        <div class="progress-labels">
          <span class="progress-used" id="tylenolUsedText">0 mg taken</span>
          <span class="progress-max">Max: 4,000 mg/day</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="tylenolProgressFill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Hard Limit Warning Banner -->
      <div class="dose-warning-badge" id="tylenolWarningBadge"></div>

      <!-- Separate Single-Line Wait/Ready Notification -->
      <div class="wait-notification-line ready" id="tylenolWaitNotification">
        <span id="tylenolWaitText">Ready for next dose</span>
        <span id="tylenolWaitClock">Now</span>
      </div>

      <!-- Action Row -->
      <div class="action-row">
        <button class="btn-log-now state-ready" id="tylenolLogBtn" onclick="logDose('tylenol')">
          <span>+</span> <span id="tylenolLogBtnText">Ready</span>
        </button>
        <button class="btn-log-past" onclick="openPastModal('tylenol')" title="Log past dose">
          ⏱️ Past
        </button>
      </div>
    </div>

  </div>

  <!-- Dose History Timeline -->
  <div class="history-card">
    <div class="history-header">
      <div class="history-title">Timeline History 🐾</div>
      <button class="btn-clear" onclick="confirmClearHistory()">Clear Log</button>
    </div>

    <div class="history-list" id="historyList">
      <div class="empty-state">No doses logged yet today.</div>
    </div>
  </div>

  <!-- Modal for Logging Past Doses -->
  <div class="modal-overlay" id="pastModal" onclick="closePastModalOverlay(event)">
    <div class="modal-card">
      <div class="modal-title" id="modalTitle">Log Past Dose</div>

      <!-- Dose selection inside modal -->
      <div class="modal-group">
        <label class="modal-label">Dosage</label>
        <div class="dose-selector-tabs" id="modalDoseTabs" style="width: 100%; display: flex;">
          <!-- Dynamically populated via updateModalTabs() -->
        </div>
      </div>

      <div class="modal-group">
        <label class="modal-label">Time Taken</label>
        <input type="time" class="modal-time-input" id="pastTimeInput">
        <div class="modal-quick-chips">
          <div class="modal-chip" onclick="setPastTimeOffset(15)">15m ago</div>
          <div class="modal-chip" onclick="setPastTimeOffset(30)">30m ago</div>
          <div class="modal-chip" onclick="setPastTimeOffset(60)">1h ago</div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closePastModal()">Cancel</button>
        <button class="btn-modal-save" id="modalSaveBtn" onclick="savePastDose()">Save Dose</button>
      </div>
    </div>
  </div>

  <script>
    // State
    const STORAGE_KEY = 'marc_med_tracker_v2';
    
    // Limits
    const LIMITS = {
      advil: {
        caution: 1200,
        hard: 1600
      },
      tylenol: {
        caution: 3000,
        hard: 4000
      }
    };

    let selectedDoses = {
      advil: 400,
      tylenol: 1000
    };

    let pastModalMed = 'advil';
    let modalSelectedDose = 400;

    let doseHistory = [];

    // Safety interval based on dose amount:
    // Half dose (200mg Advil / 500mg Tylenol) = 3 hours (180 mins)
    // Full dose (400mg Advil / 1000mg Tylenol) = 6 hours (360 mins)
    function getIntervalMinutes(med, doseMg) {
      if (med === 'advil') {
        return (doseMg <= 200) ? 180 : 360;
      } else {
        return (doseMg <= 500) ? 180 : 360;
      }
    }

    function init() {
      loadHistory();
      updateDynamicGreeting();
      updateCenterDate();
      renderUI();
      setInterval(renderUI, 30000);
    }

    function loadHistory() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          doseHistory = JSON.parse(saved);
        } catch (e) {
          doseHistory = [];
        }
      }
    }

    function saveHistory() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(doseHistory));
    }

    function updateDynamicGreeting() {
      const now = new Date();
      const hour = now.getHours();
      const titleEl = document.getElementById('greetingTitle');
      const subEl = document.getElementById('greetingSub');

      if (hour >= 5 && hour < 12) {
        titleEl.innerText = "Good morning, Marc ☀️";
        subEl.innerText = "Wishing you a calm and comfortable start.";
      } else if (hour >= 12 && hour < 17) {
        titleEl.innerText = "Good afternoon, Marc 🌿";
        subEl.innerText = "Remember to stay hydrated and rest as needed.";
      } else if (hour >= 17 && hour < 22) {
        titleEl.innerText = "Good evening, Marc 🍵";
        subEl.innerText = "Wind down comfortably and rest your body.";
      } else {
        titleEl.innerText = "Good night, Marc 🌙";
        subEl.innerText = "Sleep softly and let your body heal.";
      }
    }

    function updateCenterDate() {
      const now = new Date();
      const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
      document.getElementById('liveDateText').innerText = now.toLocaleDateString('en-US', options);
    }

    function setDoseSelection(med, dose) {
      selectedDoses[med] = dose;
      
      if (med === 'advil') {
        document.getElementById('advilDose200').className = 'dose-tab ' + (dose === 200 ? 'active' : '');
        document.getElementById('advilDose400').className = 'dose-tab ' + (dose === 400 ? 'active' : '');
      } else {
        document.getElementById('tylenolDose500').className = 'dose-tab ' + (dose === 500 ? 'active' : '');
        document.getElementById('tylenolDose1000').className = 'dose-tab ' + (dose === 1000 ? 'active' : '');
      }
      renderUI();
    }

    function getTodayDoses(med) {
      const todayStr = new Date().toDateString();
      return doseHistory.filter(item => {
        const itemDate = new Date(item.timestamp).toDateString();
        return itemDate === todayStr && item.med === med;
      });
    }

    function getTodayTotalMg(med) {
      return getTodayDoses(med).reduce((sum, item) => sum + (item.dose || 0), 0);
    }

    function getLastDose(med) {
      const medDoses = doseHistory.filter(i => i.med === med);
      return medDoses.length > 0 ? medDoses[0] : null;
    }

    function logDose(med, timestamp = new Date().toISOString(), doseAmount = null) {
      const dose = doseAmount || selectedDoses[med];
      const currentTotal = getTodayTotalMg(med);

      if (currentTotal + dose > LIMITS[med].hard) {
        alert(`Cannot add ${dose} mg. It exceeds today's maximum safe limit of ${LIMITS[med].hard} mg for ${med === 'advil' ? 'Advil' : 'Tylenol'}.`);
        return;
      }

      doseHistory.unshift({
        id: Date.now() + Math.random().toString(),
        med: med,
        dose: dose,
        timestamp: timestamp
      });

      doseHistory.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      saveHistory();
      renderUI();
    }

    function deleteDose(id) {
      doseHistory = doseHistory.filter(item => item.id !== id);
      saveHistory();
      renderUI();
    }

    function confirmClearHistory() {
      if (confirm("Clear all logged history?")) {
        doseHistory = [];
        saveHistory();
        renderUI();
      }
    }

    function renderUI() {
      renderMedCard('advil');
      renderMedCard('tylenol');
      renderHistoryList();
    }

    function renderMedCard(med) {
      const isAdvil = med === 'advil';
      const todayTotal = getTodayTotalMg(med);
      const hardLimit = LIMITS[med].hard;
      const cautionLimit = LIMITS[med].caution;
      const targetDose = selectedDoses[med];

      const usedTextEl = document.getElementById(isAdvil ? 'advilUsedText' : 'tylenolUsedText');
      const progressFill = document.getElementById(isAdvil ? 'advilProgressFill' : 'tylenolProgressFill');
      const warningBadge = document.getElementById(isAdvil ? 'advilWarningBadge' : 'tylenolWarningBadge');

      usedTextEl.innerText = `${todayTotal.toLocaleString()} mg taken`;
      const pct = Math.min(100, Math.round((todayTotal / hardLimit) * 100));
      progressFill.style.width = `${pct}%`;

      progressFill.classList.remove('warning', 'maxed');
      warningBadge.className = 'dose-warning-badge';
      warningBadge.style.display = 'none';

      if (todayTotal >= hardLimit) {
        progressFill.classList.add('maxed');
        warningBadge.className = 'dose-warning-badge hard-limit';
        warningBadge.innerText = `🛑 Daily Hard Limit reached (${hardLimit} mg). No more doses permitted today.`;
        warningBadge.style.display = 'block';
      } else if (todayTotal >= cautionLimit) {
        progressFill.classList.add('warning');
        warningBadge.className = 'dose-warning-badge caution';
        warningBadge.innerText = `⚠️ Approaching daily maximum limit (${todayTotal} / ${hardLimit} mg).`;
        warningBadge.style.display = 'block';
      }

      const last = getLastDose(med);
      const waitBanner = document.getElementById(isAdvil ? 'advilWaitNotification' : 'tylenolWaitNotification');
      const waitText = document.getElementById(isAdvil ? 'advilWaitText' : 'tylenolWaitText');
      const waitClock = document.getElementById(isAdvil ? 'advilWaitClock' : 'tylenolWaitClock');
      const logBtn = document.getElementById(isAdvil ? 'advilLogBtn' : 'tylenolLogBtn');
      const logBtnText = document.getElementById(isAdvil ? 'advilLogBtnText' : 'tylenolLogBtnText');

      let isReady = true;
      let remainingMin = 0;

      if (last) {
        const lastTime = new Date(last.timestamp);
        const intervalMins = getIntervalMinutes(med, last.dose);
        const nextEligibleTime = new Date(lastTime.getTime() + (intervalMins * 60000));
        const diffMs = nextEligibleTime - new Date();

        if (diffMs > 0) {
          isReady = false;
          remainingMin = Math.ceil(diffMs / 60000);
        }
      }

      const isBlockedByLimit = (todayTotal + targetDose) > hardLimit;

      if (isBlockedByLimit) {
        logBtn.disabled = true;
        logBtn.className = 'btn-log-now';
        logBtnText.innerText = "Maxed";

        waitBanner.className = 'wait-notification-line waiting';
        waitText.innerText = "Max daily dose reached";
        waitClock.innerText = "Limit";
      } else if (!isReady) {
        logBtn.disabled = false;
        logBtn.className = 'btn-log-now state-wait';
        logBtnText.innerText = "Wait";

        waitBanner.className = 'wait-notification-line waiting';
        
        const hrs = Math.floor(remainingMin / 60);
        const mins = remainingMin % 60;
        const timeStr = hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m`;

        waitText.innerText = `Wait ${timeStr} before next dose`;
        waitClock.innerText = `⏳ ${timeStr}`;
      } else {
        logBtn.disabled = false;
        logBtn.className = 'btn-log-now state-ready';
        logBtnText.innerText = "Ready";

        waitBanner.className = 'wait-notification-line ready';
        waitText.innerText = "Ready for next dose";
        waitClock.innerText = "Ready 🌸";
      }
    }

    function renderHistoryList() {
      const listEl = document.getElementById('historyList');
      if (doseHistory.length === 0) {
        listEl.innerHTML = `<div class="empty-state">No doses logged yet today.</div>`;
        return;
      }

      listEl.innerHTML = doseHistory.map(item => {
        const dateObj = new Date(item.timestamp);
        const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const isAdvil = item.med === 'advil';
        const name = isAdvil ? 'Advil' : 'Tylenol';

        return `
          <div class="history-item ${item.med}">
            <div class="history-item-left">
              <span>${isAdvil ? '🧡' : '🩵'}</span>
              <div>
                <span class="history-med-name">${name}</span>
                <span class="history-med-dose">${item.dose} mg</span>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="history-time">${timeStr}</span>
              <button class="history-delete-btn" onclick="deleteDose('${item.id}')" title="Delete">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    /* Past Modal Logic & Direct Tab Re-rendering */
    function updateModalTabs() {
      const tabsWrap = document.getElementById('modalDoseTabs');
      const isAdvil = (pastModalMed === 'advil');
      const options = isAdvil ? [200, 400] : [500, 1000];
      const activeColor = isAdvil ? 'var(--advil-primary)' : 'var(--tylenol-primary)';

      tabsWrap.innerHTML = options.map(d => {
        const isActive = (modalSelectedDose === d);
        const activeStyles = isActive 
          ? `background: ${activeColor}; color: #ffffff; font-weight: 800; box-shadow: 0 2px 8px rgba(0,0,0,0.18);` 
          : `background: transparent; color: var(--text-muted); font-weight: 700;`;

        return `
          <button type="button" class="dose-tab" style="flex:1; ${activeStyles}" onclick="setModalDose(${d})">
            ${d} mg
          </button>
        `;
      }).join('');
    }

    function setModalDose(dose) {
      modalSelectedDose = Number(dose);
      updateModalTabs();
    }

    function openPastModal(med) {
      pastModalMed = med;
      // Pre-select whatever dose is currently picked on the main card
      modalSelectedDose = Number(selectedDoses[med]);

      const isAdvil = (med === 'advil');
      document.getElementById('modalTitle').innerText = `Log Past ${isAdvil ? 'Advil' : 'Tylenol'}`;
      document.getElementById('modalSaveBtn').style.background = isAdvil ? 'var(--advil-primary)' : 'var(--tylenol-primary)';

      updateModalTabs();

      // Default time to current time
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('pastTimeInput').value = `${hh}:${mm}`;

      document.getElementById('pastModal').classList.add('active');
    }

    function setPastTimeOffset(minsAgo) {
      const d = new Date(Date.now() - (minsAgo * 60000));
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      document.getElementById('pastTimeInput').value = `${hh}:${mm}`;
    }

    function closePastModal() {
      document.getElementById('pastModal').classList.remove('active');
    }

    function closePastModalOverlay(e) {
      if (e.target.id === 'pastModal') closePastModal();
    }

    function savePastDose() {
      const timeVal = document.getElementById('pastTimeInput').value;
      if (!timeVal) return;

      const [hours, mins] = timeVal.split(':');
      const doseTime = new Date();
      doseTime.setHours(parseInt(hours, 10), parseInt(mins, 10), 0, 0);

      logDose(pastModalMed, doseTime.toISOString(), modalSelectedDose);
      closePastModal();
    }

    window.onload = init;
  </script>
</body>
</html>
